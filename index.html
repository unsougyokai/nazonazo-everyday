<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>毎日なぞなぞ</title>
<style>
  body {
    font-family: "Yu Gothic", sans-serif;
    background: #f9f3f5; /* なぞなぞうさんの世界観に合わせて淡いピンク */
    color: #333;
    padding: 40px;
    max-width: 650px;
    margin: auto;
    line-height: 1.8;
  }

  /* ロゴ風タイトル */
  .logo-title {
    font-size: 2.4em;
    font-weight: bold;
    color: #d86ca4; /* ピンク系でキャラクター性を表現 */
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 0.08em;
  }

  /* サブタイトル（なぞなぞうさん紹介） */
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 40px;
    font-size: 0.95em;
  }

  .question-box {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #666;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  button:hover {
    background: #555;
  }

  .answer {
    display: none;
    margin-top: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

<!-- ロゴ風タイトル -->
<div class="logo-title">毎日なぞなぞ</div>

<!-- なぞなぞうさん紹介文 -->
<div class="subtitle">
  ピンク色の眼鏡をかけた2足歩行のぞう、<strong>なぞなぞうさん</strong>が<br>
  毎日1問、あなたに「なぞなぞ」をお届けします。
</div>

<div class="question-box">
  <div id="question"></div>
  <button onclick="showAnswer()">答えを見る</button>
  <div id="answer" class="answer"></div>
</div>

<script>
  const riddles = [
    { q: "パンはパンでも食べられないパンは？", a: "フライパン" },
    { q: "家の中でいつも転がっているものは？", a: "玄関（げんかん）" },
    { q: "叩くと痛いけど、叩かないと困るものは？", a: "ドア" },
    { q: "上から読んでも下から読んでも同じ県は？", a: "奈良県" }
  ];

  const today = new Date();
  const index = today.getDate() % riddles.length;

  document.getElementById("question").textContent = riddles[index].q;

  function showAnswer() {
    document.getElementById("answer").textContent = riddles[index].a;
    document.getElementById("answer").style.display = "block";
  }
</script>

</body>
</html>
