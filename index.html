<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>なぞなぞ1</title>
<style>
  body {
    font-family: "Yu Gothic", sans-serif;
    background: #f9f3f5;
    color: #333;
    padding: 40px;
    max-width: 650px;
    margin: auto;
    line-height: 1.8;
  }

  .question-box {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #666;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  button:hover {
    background: #555;
  }

  .answer {
    display: none;
    margin-top: 20px;
    font-weight: bold;
  }

  a {
    color: #d86ca4;
    text-decoration: none;
  }
</style>
</head>
<body>

<a href="index.html">← なぞなぞ一覧に戻る</a>

<div class="question-box">
  <h2>パンはパンでも食べられないパンは？</h2>

  <button onclick="showAnswer()">答えを見る</button>
  <div id="answer" class="answer">フライパン</div>
</div>

<script>
  function showAnswer() {
    document.getElementById("answer").style.display = "block";
  }
</script>

</body>
</html>
